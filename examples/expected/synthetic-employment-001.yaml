# Golden set — synthetic/employment-001.pdf (Phase 5 v1, card t_5400fec1).
#
# This is the EN #1 STRESS contract of the Phase 5 v1
# Employment eval starter. It has 3 hand-injected deviations
# from the ABA-anchored clean baseline, calibrated to a US
# employment counsel reviewer's expected verdict. The
# contract text is generated by
# scripts/build_employment_eval_contracts.py (deterministic
# reportlab PDF, no timestamps in the visible text).
#
# Why this contract is synthetic
# ------------------------------
# Phase 5 v1 is a 3-contract starter (2 EN + 1 DE) before
# the v2 expansion (gated on v1 F1 being acceptable) grows
# the set to 10 contracts. The 2 EN v1 contracts exercise
# the 5 EN baseline values (notice_period, remuneration,
# leave_entitlements, termination_for_cause, non_solicitation)
# plus 3 GAP.md values (working_hours, probation,
# confidentiality_survival). The v1 set covers 8 of the 11
# employment_* Phase 5 taxonomy values; the remaining 3
# (garden_leave, non_compete, ip_assignment) are in v2's
# public clean baselines.
#
# The 3 deviations
# ----------------
# 1. **c1 (employment_notice_period) — material deviation.**
#    "ninety (90) days" vs. ABA baseline 30-day max + US
#    at-will framing. 90 days is a unilateral extension not
#    warranted by tenure and is enforceable in California
#    only with separate consideration per Edwards v. Arthur
#    Andersen LLP (2008) 44 Cal. 4th 937. Material because
#    (a) it exceeds the US at-will norm and (b) it's
#    specifically unenforceable in California (the contract
#    is California-anchored per the preamble).
# 2. **c2 (employment_remuneration) — material deviation.**
#    "in the sole and absolute discretion of the Company,
#    and the Employee shall have no contractual entitlement
#    to any bonus" — vs. the ABA baseline that entitles
#    base + bonus per the Compensation clause. The ABA
#    Section 2 template entitles both base salary and an
#    annual bonus "as determined by the Company in its sole
#    discretion"; this contract removes even that
#    discretionary commitment and substitutes "no contractual
#    entitlement" language. Material.
# 3. **c4 (employment_termination_for_cause) — minor
#    deviation.** "not less than thirty (30) days' prior
#    written notice of any termination" vs. ABA baseline
#    immediate-for-cause. 30-day notice is a courtesy window.
#    Minor — the cause threshold is preserved; only the
#    timing changes.
#
# The other 5 clauses (c3, c5, c6, c7, c8) are clean
# baselines — no expected deviations.

contract: examples/contracts/synthetic/employment-001.pdf
type: employment
language: en

expected_clauses:
  - id: c1
    type: employment_notice_period
    # DEVIATION: "ninety (90) days" statt 30-Tage-Standard
    text_excerpt: "1. Notice Period. Either Party may terminate this Agreement by giving the other Party not less than ninety (90) days' prior written notice"
  - id: c2
    type: employment_remuneration
    # DEVIATION: "sole and absolute discretion ... no contractual entitlement"
    text_excerpt: "2. Compensation. The Company shall pay the Employee an annual base salary of the amount set out in Schedule A, payable in equal monthly installments in arrears. Any annual bonus shall be awarded, if at all, in the sole and absolute discretion of the Company, and the Employee shall have no contractual entitlement to any bonus"
  - id: c3
    type: employment_leave_entitlements
    text_excerpt: "3. Vacation and Leave. The Employee shall be entitled to twenty-five (25) paid vacation days per calendar year, accruing pro rata, in addition to public holidays"
  - id: c4
    type: employment_termination_for_cause
    # DEVIATION: "thirty (30) days' prior written notice of any termination"
    text_excerpt: "4. Termination for Cause. The Company may terminate this Agreement for cause, including but not limited to: (a) material breach of this Agreement by the Employee, (b) gross misconduct, (c) conviction of a felony, or (d) sustained unsatisfactory performance. The Company shall give the Employee not less than thirty (30) days' prior written notice of any termination"
  - id: c5
    type: employment_non_solicitation
    text_excerpt: "5. Non-Solicitation. For a period of twelve (12) months following the termination of the Employee's employment, the Employee shall not, directly or indirectly, solicit any employee, contractor, customer, or client of the Company with whom the Employee had material contact"
  - id: c6
    type: employment_working_hours
    text_excerpt: "6. Working Hours. The Employee's normal working hours shall be 9:00 a.m. to 6:00 p.m. Monday through Friday, with one (1) hour for lunch"
  - id: c7
    type: employment_probation
    text_excerpt: "7. Probationary Period. The first ninety (90) days of the Employee's employment shall constitute a probationary period, during which either Party may terminate this Agreement by giving the other Party not less than seven (7) days' prior written notice"
  - id: c8
    type: employment_confidentiality_survival
    text_excerpt: "8. Confidentiality; Survival. The Employee shall maintain the confidentiality of all Confidential Information of the Company both during and after the term of employment, for a period of three (3) years following termination"

# Drei erwartete Abweichungen.
expected_deviations:
  - clause_id: c1
    severity: 2
    category: notice_period_90_tage_us_at_will
    rationale: >-
      "ninety (90) days" überschreitet das im ABA Model
      Employment Agreement vorgesehene Maximum und ist
      unvereinbar mit dem US-at-will-Standard. In
      Kalifornien (Vertragsgegenstand ist kalifornisches
      Recht per Präambel) sind Post-Employment-
      Beschränkungen ohne gesonderte Gegenleistung gemäß
      Edwards v. Arthur Andersen LLP (2008) 44 Cal. 4th
      937 nichtig. Material.
    citation:
      playbook_clause_id: employment-notice-period
      source_url: "https://www.americanbar.org/groups/business_law/resources/model-employment-agreement/"
  - clause_id: c2
    severity: 2
    category: bonus_keine_vertragliche_anspruache
    rationale: >-
      "in the sole and absolute discretion of the Company,
      and the Employee shall have no contractual entitlement
      to any bonus" entfernt die im ABA-Template vorgesehene
      discretionary bonus-Verpflichtung. Material.
    citation:
      playbook_clause_id: employment-remuneration
      source_url: "https://www.americanbar.org/groups/business_law/resources/model-employment-agreement/"
  - clause_id: c4
    severity: 1
    category: kuendigung_30_tage_vor_cause
    rationale: >-
      "not less than thirty (30) days' prior written notice
      of any termination" fügt dem im ABA-Template
      vorgesehenen immediate-for-cause-Recht eine
      30-Tage-Frist hinzu. Minor, nicht material — die
      Cause-Trigger bleiben erhalten.
    citation:
      playbook_clause_id: employment-termination-for-cause
      source_url: "https://www.americanbar.org/groups/business_law/resources/model-employment-agreement/"
