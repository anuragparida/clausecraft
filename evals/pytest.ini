# Local pytest config for the eval harness.
# Overrides the root pytest.ini's ``testpaths = tests`` so
# `pytest evals/` actually collects here. The harness's test
# lives at evals/harness.py and the fixtures at evals/conftest.py.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = evals
python_files = harness.py test_*.py *_test.py
markers =
    contract: marker for per-contract diagnostic smoke tests in evals/harness.py
