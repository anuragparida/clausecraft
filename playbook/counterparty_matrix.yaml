# clausecraft — counterparty matrix
#
# Phase 2 ships the loader and a *flat* verdict lookup. The
# counterparty-aware overrides land in Phase 5 (see docs/11-phases.md
# Phase 5 scope: "the matrix is the source of truth for
# (clause_type, counterparty_type) → acceptable_range").
#
# Phase 4 adds a sibling language axis: a few DE-specific entries
# become stricter when the contract is in German AND the
# counterparty is a German entity. The shape is:
#
#   language_overrides[language][counterparty_type][clause_type] = verdict
#
# This mirrors the existing 2D `counterparty_overrides` shape
# (`counterparty_type → clause_type → verdict`) and stacks the
# language axis on top. The DE column only NARROWS verdicts for
# DE counterparty types — the EN path is unchanged.
#
# Verdict scale (matches the spotter's score scale in Phase 2):
#   0 = aligned (matches baseline)
#   1 = minor deviation (typographical, equivalent wording)
#   2 = material deviation (worth flagging, negotiate)
#   3 = unacceptable (hard blocker for this counterparty type)
#
# When the matrix is flat, every (clause_type) is treated as
# "counterparty_type=any" and the verdict is the default.
version: "0.1.0-de"
contract_type: nda
language: en
default_counterparty_type: any
# The default verdict for any (clause_type) that does NOT have an
# explicit override below. The spotter will produce a score; the
# matrix is consulted to *re-classify* the score into a verdict
# (acceptable / material / unacceptable) for the UI. In Phase 2
# the matrix is loaded but the verdict column is rendered as
# "flat: <verdict>" so reviewers can see the matrix is wired in
# but not yet counterparty-aware.
default_verdict: aligned
# Per-clause-type verdict overrides. Keyed by ClauseType enum value
# (lowercase snake_case, matches backend/app/classify/schema.py).
clause_verdicts:
  definition_confidential_info: aligned
  term: aligned
  residual_knowledge: aligned
  governing_law: aligned
  injunctive_relief: aligned
  return_of_materials: aligned
  non_solicit: aligned
  non_compete: aligned
  indemnity: aligned
  limitation_of_liability: aligned
  assignment: aligned
  entire_agreement: aligned
  severability: aligned
  notices: aligned
  counterparts: aligned
  unknown: aligned
# Phase 5 will add a section like:
#   counterparty_overrides:
#     enterprise:
#       term: { max_years: 5, acceptable: true }
#       governing_law: { restrict_to: [DE, US-DE] }
#     healthcare:
#       term: { max_years: 1, acceptable: false }
# and `lookup_verdict(clause_type, counterparty_type, score)` will
# apply the override. For Phase 2 this entire section is ignored.
counterparty_overrides: {}
# Phase 4: language axis as a sibling of `counterparty_overrides`.
# Shape: `language → { counterparty_type → { clause_type → verdict } }`.
# The DE column is *additive* — only narrows verdicts for DE
# counterparty types. EN lookup is unchanged.
#
# The current DE counterparty types are intentionally coarse — the
# spec calls out that the counterparty matrix is a Phase 5 feature;
# Phase 4 only adds a single language axis. We surface one DE
# counterparty type for now (`de_german_entity`) and leave the
# schema open for the Phase 5 expansion.
#
# DE-specific stricter verdicts (per docs/11-phases.md Phase 4 spec):
#   - governing_law: when counterparty is a German entity, deviation
#     from "German courts" jurisdiction is more material. The EN
#     default is `aligned`; for DE counterparty types we escalate
#     any non-German-law deviation to `material` (negotiate) — the
#     German party will push back hard on US/NY/England jurisdiction.
#   - limitation_of_liability: German `Haftungsbeschränkung` norms
#     differ; missing or one-sided limitation becomes `material`.
#   - term: DE BGB notice periods have a specific shape (Kündigungs­
#     frist); non-standard terms become `material` for DE counterparties.
language_overrides:
  de:
    counterparty_overrides:
      de_german_entity:
        governing_law: material
        limitation_of_liability: material
        term: material
