license: >-
  Bundesdatenschutzgesetz (BDSG), konsolidierte Fassung.
  Amtliche Texte von Bundesgesetzen sind gemäß § 5 UrhG vom
  deutschen Urheberrecht ausgenommen; die Veröffentlichung auf
  gesetze-im-internet.de erfolgt ohne Nutzungsbeschränkung.
  Die Baseline-Sprache ist eine paraphrasierte Verdichtung
  des § 62 Abs. 4 i. V. m. Abs. 5 BDSG, keine wortgetreue
  Übernahme des Gesetzes.
notes: >-
  Diese Baseline erfasst die *Weiterreichungs-Pflicht* des
  Auftragsverarbeiters gegenüber seinem Verantwortlichen für
  den Fall, dass er einen Unterauftragsverarbeiter einschaltet.
  Sie ergänzt dpa_subprocessor_consent (das das Einwilligungs-
  Tor erfasst, also das Ob des Einschaltens) und stellt
  zusammen mit dieser eine vollständige Unterauftragsverarbeiter-
  Steuerung sicher. Im EN-Baseline-Set ist diese Pflicht
  ausdrücklich ausgespart, weil die EN-Karte (t_45151f58) das
  Einwilligungs-Tor über die EDPB-Leitlinien 7/2020 abdeckt;
  im DE-Set ergänzen sich Einwilligungs-Tor (EDPB DE-Übersetzung
  der Leitlinien) und Weiterreichungs-Pflicht (BDSG § 62 Abs. 4)
  zu einer vollständigen Steuerung mit zwei komplementären
  Quellen, ohne dass eine Baseline in beiden Sprachen dupliziert
  wird. Das Matrix-Verdikt für einen Vertrag, der die
  Weiterreichungs-Pflicht auslässt, ist „nicht akzeptabel" für
  jeden Vertragspartnertyp — die Pflicht aus § 62 Abs. 4 BDSG
  ist nicht abdingbar.
