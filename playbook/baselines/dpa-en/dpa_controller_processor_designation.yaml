# Playbook-Baseline — DPA (EN) — dpa_controller_processor_designation
#
# Source: Art. 28(3) Regulation (EU) 2016/679 (GDPR), consolidated text
# published by the Publications Office of the European Union (EUR-Lex
# CELEX:32016R0679). Art. 28(3) is the mandatory-contents checklist
# for a written contract between a controller and a processor; the
# designation of the parties' GDPR roles is the first item on that
# checklist. The statute is in the public domain (no copyright on
# Union law under Art. 8(1) of the Berne Convention + the EU's open
# data policy), so we cite the official text and paraphrase the
# operative language into a canonical baseline.
#
# This baseline is the *structural* one — it allocates the
# controller vs processor role for the entire DPA. Every other
# dpa_* clause builds off this designation (a sub-processor clause
# only makes sense if the upstream processor relationship is
# defined; an audit-rights clause only attaches to a processor;
# etc.). Helena's review card should treat a missing
# controller/processor designation as a structural failure
# regardless of counterparty type.
clause_id: controller-processor-designation-art-28-3
type: dpa_controller_processor_designation
language: en
title: Controller and Processor designation under Art. 28(3) GDPR
text: >-
  The parties acknowledge that, for the purposes of this Agreement,
  the Customer is the Controller and the Processor is the Processor
  of Personal Data, each as defined in Regulation (EU) 2016/679
  (the "General Data Protection Regulation" or "GDPR"). The
  Processor shall process Personal Data only on the documented
  instructions of the Controller, including with regard to
  transfers of Personal Data to a third country or an
  international organisation, unless required to do so by Union or
  Member State law to which the Processor is subject. In such a
  case, the Processor shall inform the Controller of that legal
  requirement before processing, unless that law prohibits such
  information on important grounds of public interest. The
  Processor shall not process Personal Data for any purpose other
  than the purposes set out in the Controller's documented
  instructions or as required by applicable law.
source_url: https://gdpr-info.eu/art-28-gdpr/
retrieval_date: 2026-06-09
license: >-
  Public-domain legal text. Art. 8(1) Berne Convention places
  texts of laws and regulations outside the scope of copyright
  protection; the EU's open-data policy (Decision 2011/833/EU)
  reaffirms this. The baseline language is a paraphrased
  distillation of Art. 28(3) first sub-paragraph, not a verbatim
  copy.
notes: >-
  This baseline covers the *designation* sub-clause of a DPA. It
  does NOT cover the related but distinct questions of
  (a) joint-controller status under Art. 26 (different
  allocation, separate clause), (b) sub-processor governance
  (covered by dpa_subprocessor_consent and dpa_subprocessor_flowdown),
  or (c) the specific documented-instructions mechanism (covered
  by dpa_data_subject_rights, which references the controller's
  right to give and withdraw instructions). The matrix verdict
  for a DPA that names the parties but allocates the wrong role
  (e.g. "Processor is the Controller") is "unacceptable" for
  every counterparty type — this is a structural misallocation,
  not a negotiable deviation.
