notes: >-
  Vertragliche Erweiterungen sind üblich und erforderlich: Die
  Geschäftsgeheimnis-Definition des GeschGehG ist abschließend für
  den strafrechtlichen (vgl. § 23 GeschGehG) und zivilrechtlichen
  Geheimnisschutz (vgl. §§ 6 ff. GeschGehG). Im vertraglichen Rahmen
  können die Parteien weitergehende Geheimhaltungspflichten
  vereinbaren, die auch Informationen unterhalb der
  Geschäftsgeheimnis-Schwelle erfassen; vgl. IHK-Hessen-Muster
  Ziff. 2 sowie IHK-München-Muster Ziff. 2.1 lit. b: „Sofern eine
  Vertrauliche Information ... nicht den Anforderungen ... eines
  Geschäftsgeheimnisses ... genügt, unterfällt diese Information
  dennoch den Vertraulichkeitsverpflichtungen nach dieser
  Vereinbarung." Solche Erweiterungen sind statthaft, müssen aber
  das GeschGehG-Schutzniveau nicht zwingend erreichen und
  begründen einen rein vertraglichen Anspruch.
